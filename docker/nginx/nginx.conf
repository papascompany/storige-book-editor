user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ─────────────────────────────────────────────────────────────────
    # HTTP : Let's Encrypt ACME challenge + HTTPS 리다이렉트
    # ─────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.papascompany.co.kr;

        # certbot HTTP-01 챌린지 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 그 외 모두 HTTPS로
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────────────────────────
    # HTTPS : api.papascompany.co.kr — Storige API
    # ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api.papascompany.co.kr;

        ssl_certificate     /etc/letsencrypt/live/api.papascompany.co.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.papascompany.co.kr/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # PDF/이미지 업로드 여유분
        client_max_body_size 100M;

        # P2-8 메트릭: 외부에서 /api/health/metrics 차단 (Prometheus는 docker network 내부 직접 접근)
        location = /api/health/metrics {
            return 404;
        }

        # API 요청 → NestJS 컨테이너
        location /api/ {
            proxy_pass http://api:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            # 트랙 B-(c): 대용량 스트림 통과 — nginx 가 응답/요청 본문을 디스크/메모리에 버퍼링하지
            # 않고 그대로 흘려보낸다. 미설정 시 nginx 가 2GB 다운로드(/files/:id/raw·download)를
            # 통째 버퍼링해 지연/디스크압박 발생. API 스트리밍(stream.pipe)과 짝을 이뤄야 효과.
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # P2-8 Grafana 운영 메트릭 대시보드
        # GF_SERVER_SERVE_FROM_SUB_PATH=true 와 함께 동작
        # Grafana 자체 인증(admin / GRAFANA_ADMIN_PASSWORD env) 사용
        # ⚠️ proxy_pass 끝 슬래시 없음 — Grafana가 subpath(/grafana)를 직접 받아야 무한 redirect 방지
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Grafana live (websocket)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        # ── S4 2단계(2026-08-28, D3·D4): 합성 산출물 서명 서빙 ──────────────
        # API 의 GET /worker-jobs/external/:id/output-url 이 발급한 서명 URL 전용.
        # 검증식은 output-url-signer.ts 와 짝: md5( "<expires><uri><secret>" ).
        # 시크릿은 PUBLIC 레포에 커밋하지 않는다 — VPS 에서
        #   docker/nginx/secure-link-secret.conf (gitignored, .example 참조)
        # 를 생성해 마운트한다. 파일이 없으면 nginx 기동이 실패한다(= 배포 시 즉시 발견).
        # ⚠️ 기존 무인증 /storage/outputs/ 는 유예(grandfathering, D4)로 아직 병행
        #    서빙된다 — cutover(D5, 파트너 조율)는 그 location 에서 별도로 닫는다.
        location /storage-signed/outputs/ {
            include /etc/nginx/secure-link-secret.conf;  # set $outputs_sign_secret "…";
            secure_link $arg_md5,$arg_expires;
            secure_link_md5 "$secure_link_expires$uri$outputs_sign_secret";
            if ($secure_link = "") { return 403; }   # 서명 없음/불일치
            if ($secure_link = "0") { return 410; }  # 만료 — 재발급 API 재호출
            alias /app/storage/outputs/;
            # 서명 URL 은 단명 자격증명이다 — 캐시/재공유 금지.
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin "*";
            add_header Cross-Origin-Resource-Policy "cross-origin";
        }

        # 업로드된 정적 파일 (이미지/PDF)
        location /storage/ {
            alias /app/storage/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            # 선언 MIME 와 다른 페이로드(예: png 라벨인데 실제 html/svg)를 브라우저가 sniff 해
            # 실행하지 못하게 차단(업로드 파일 inline XSS 방어).
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin "*";
            # P2-11/B — editor가 crossOriginIsolated 모드일 때 fabric 이미지 로드 통과
            add_header Cross-Origin-Resource-Policy "cross-origin";
        }

        # 소스맵 차단 (source-exposure 이중화, 2026-07-27)
        # ⚠️ /embed/ 는 빌드 산출 디렉터리(apps/editor/dist-embed)를 alias 로 **직접 서빙**한다
        #    (docker-compose.yml 의 ro 마운트). 즉 bookmoa 로 복사하지 않아도 맵이 그대로 공개된다.
        #    1차 방어는 postbuild:embed 의 strip-sourcemaps(--force-strip), 이 규칙은 2차 방어.
        location ~ ^/embed/.*\.map$ {
            return 404;
        }

        # 에디터 임베드 번들 (bookmoa PHP 측 임베드용)
        location /embed/ {
            alias /app/editor-embed/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            # P2-11/B — crossOriginIsolated 호환
            add_header Cross-Origin-Resource-Policy "cross-origin";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type "text/plain; charset=utf-8";
                add_header Content-Length 0;
                return 204;
            }

            gzip_static on;
        }

        # 루트 - 단순 텍스트
        location = / {
            return 200 "Storige API\n";
            add_header Content-Type text/plain;
        }
    }
}
