name: ci

# Phase 0 안전판 — contract test 를 CI 게이트로 승격 (계획서 §Phase 0-3).
# 종전 CI 는 gitleaks(시크릿 스캔)뿐 = 테스트는 honor system 이었다. 이 워크플로가
# master push/PR 마다 아래를 검증한다:
#   1) apps/api jest — 파트너 동결 표면 contract test(src/contract-freeze.spec.ts) +
#      웹훅 서명 페어와이즈(webhook-signature-pairwise.spec.ts) + 기존 스펙 전부
#   2) apps/worker jest — PDF 파이프라인(GS 인자 공식·타임아웃/세마포어·합성 멱등 가드).
#      네이티브/외부 바이너리 표면이 가장 큰 앱인데 2026-07-31 까지 CI 미연결이었다
#      (아래 ⚠️ "장식이 된다"가 실현돼 있던 패키지)
#   3) packages/sdk build+typecheck+test — 파트너 SDK. types-parity/webhook-events 의
#      계약 드리프트 감시와 서명 페어와이즈(수신측)가 여기 걸려야 게이트가 된다
#   4) packages/canvas-core vitest + tsc — 편집기 코어(ServicePlugin.pdf 카나리 포함)
#   5) scripts/pdf-golden 비교 엔진 self-test (qpdf 필요)
#   6) examples/* quickstart 예제 — **뒤쪽**(문서성 산출물이 계약 테스트를 가리지 않게)
#   7) apps/docs 파트너 문서 포털 빌드 — **맨 뒤**(같은 이유. 6 과 7 은 우선순위 동급).
#      공개 모드 → 색인 차단 모드 순으로 두 번 돈다. 두 분기 모두 게이트에 걸되
#      **아티팩트는 배포와 같은 색인 차단본 하나**만 남긴다(스텝 주석 참조).
#
# ⚠️ 루트 `turbo run test` 는 CI 가 호출하지 않는다 — per-package 명시 필터만 쓴다.
#    새 패키지를 추가하면 **여기에 스텝을 추가해야** 게이트에 연결된다. 안 그러면
#    그 패키지의 테스트는 전부 장식이 된다(SDK 가 실제로 그 상태였다).
#
# ⚠️ branch protection(필수 체크 지정)은 의도적으로 미설정 — master 직push 가 곧
#    배포 트리거인 현행 운영과 충돌(오너 결정 대기). 현재는 push 후행 신호 + PR 게이트.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 25분: worker 테스트(490건) 추가분 여유. 종전 20분은 worker 없이 산정된 값.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 버전은 package.json packageManager(pnpm@9.15.0) 에서 자동 해석

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 유출 방지 검사 (외부 식별자 소스 유입 차단 — pnpm 불필요, 빠른 실패)
        # 내부 정책상 금지된 외부 식별자가 소스에 유입됐는지 검사한다. 배포 번들
        # (editor/admin)의 postbuild 게이트와 짝을 이루는 소스측 게이트. 모든 빌드
        # 변형이 같은 src 를 쓰므로 소스 검사가 변형 무관 catch-all 이다.
        #
        # E-3: 스캔 대상에 docs/ 와 확장자 .md/.txt 를 추가했다. 문서 포털이 GUIDE(.md)를
        # 그대로 공개 사이트로 발행하므로 **입력측에서 먼저** 걸어야 한다(산출물만 보면 늦다).
        # 포털 산출물(apps/docs/site)은 아래 포털 빌드의 postbuild 가 한 번 더 스캔한다.
        run: node scripts/check-source-exposure.mjs

      - name: 시스템 의존성 (qpdf=골든 self-test · cairo/pango=node-canvas 소스 빌드)
        # node-canvas(canvas@2.11.2)는 fabric 5.x node 엔트리의 하드 요구인데 Node 22 용
        # 프리빌트가 없어 소스 빌드가 필요하다. canvas 는 jsdom 의 optionalDependency 라
        # 빌드 실패가 "조용히 용인"되고(설치는 성공처럼 보임) vitest 로드 시점에
        # 'Cannot find module ../build/Release/canvas.node' 로 터진다(2026-07-03 CI 1차 실적발).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qpdf build-essential libcairo2-dev libpango1.0-dev \
            libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: types 선행 빌드 (모노레포 규약 — 다른 패키지가 dist 소비)
        run: pnpm --filter @storige/types build

      - name: sdk 빌드 + 타입체크 + 테스트 (계약 드리프트 감시 + 서명 페어와이즈 수신측)
        # types 선행 빌드 뒤여야 한다 — types-parity.spec 이 @storige/types dist 를
        # 실제 import 해 구조 등가성을 대조한다(devDependency, 런타임 의존 아님).
        # build 를 함께 도는 이유: dts 방출·번들 에러와 node: 프리픽스 보존 같은
        # 아티팩트 수준 회귀는 test 만으로는 잡히지 않는다.
        run: |
          pnpm --filter @storige/sdk build
          pnpm --filter @storige/sdk typecheck
          pnpm --filter @storige/sdk test

      - name: api 테스트 (contract-freeze + 서명 페어와이즈 + 전체 스펙)
        run: pnpm --filter @storige/api test

      # 2026-08-04 게이트 신설 — 종전 CI 에 api lint 부재(NodeJS no-undef 1err 가
      # honor system 상태였다). 기준선 결함 3건 해소와 함께 등재.
      - name: api lint
        run: pnpm --filter @storige/api lint

      - name: Partner API v1 OpenAPI export (파트너 전용 스펙 — v1 태그 필터)
        # 스크립트 내부 단언: 모든 경로 /api/v1/* + REQUIRED_PATHS(현 16경로/22오퍼레이션
        # = ping·book-specs 3·books 11·webhooks 7) 존재 — 내부 라우트 유입/누락 시 실패.
        # 등재 누락의 정본 게이트는 partner-openapi-surface.spec(FS 스캔 3중 대조, E-2).
        run: pnpm --filter @storige/api openapi:partner

      - name: Partner API v1 OpenAPI 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: openapi-partner
          path: apps/api/openapi-partner.json
          if-no-files-found: error

      - name: worker 테스트 (PDF 파이프라인 — GS 인자 공식·타임아웃/세마포어·합성 멱등 가드)
        # 감사 2026-07-30 §8: worker 는 네이티브/외부 바이너리 표면이 가장 큰 앱인데
        # CI 미연결이었다(spec 전부가 로컬 수동 실행에만 의존 — 위 ⚠️ 의 실현 사례).
        # 실 GS/qpdf 바이너리는 호출하지 않는다 — ghostscript-wk.spec 은
        # GHOSTSCRIPT_PATH=/bin/sh 대역으로 spawn·타임아웃·SIGTERM 에스컬레이션 경로만
        # 검증한다(실측: gs 부재 macOS 에서 17 suites/490 tests 통과). 시스템 의존성 추가 불필요.
        # ⚠️ WK-3 스펙은 5s jest timeout 의 실시간 스폰 테스트라 러너 과부하 시 플레이크
        #    여지가 있다(2026-07-30 로컬 전체 병렬 실행에서 1회 실측). 단독 스텝(순차)이라
        #    위험은 낮지만, 재발 시 이 스펙만 --maxWorkers 조정 대상이다.
        run: pnpm --filter @storige/worker test

      - name: canvas-core 타입체크 + 테스트 (ServicePlugin.pdf 카나리 포함)
        # ⚠️ 이 스텝은 node-canvas 가 실제로 로드돼야 의미가 있다. 위 '시스템 의존성' 스텝이
        #    소스 빌드 재료(cairo/pango/jpeg/gif/rsvg/pixman)를 깔아 두는 이유가 이것이다.
        #    canvas 로드가 실패하면 테스트가 '실패'하는 게 아니라 **수집이 줄어든다** —
        #    실측(2026-08-25) 정상 623 tests/54 files 가 파손 시 551 tests 만 수집되고
        #    "6 files failed" 로만 보였다(72건이 실패도 스킵도 아닌 부재). 그 상태가 여러
        #    스프린트 동안 "기존 베이스라인 실패 6파일(ABI)" 로 인계돼 회귀 판정에서
        #    제외되고 있었다. vitest.setup.ts 프리플라이트가 이제 그 경우 하드 실패시킨다.
        run: |
          pnpm --filter @storige/canvas-core typecheck
          pnpm --filter @storige/canvas-core test

      # 2026-08-25 게이트 신설 — 종전 CI 에 canvas-core lint 부재(no-undef 28err 가
      # "베이스라인"으로 굳어 있었고, 게이트가 없으니 아무도 깨지지 않았다). 오탐 근본
      # 제거(bf8ab1d)로 0err 가 된 시점에 등재해 재발을 막는다. api lint 스텝과 짝.
      #
      # ⚠️ lint 스크립트는 `eslint .` 다 — `eslint src` 가 아니다. 해소한 28건 중 20건이
      #    types/fabric.d.ts 에 있었는데 src 범위로는 그 파일이 게이트 밖에 남는다.
      #    (dist/node_modules/*.js 는 eslint.config.js 의 ignores 가 제외한다.)
      #    경고 48건은 기존치라 게이트 대상이 아니다 — 실패는 error 에서만 난다.
      - name: canvas-core lint
        run: pnpm --filter @storige/canvas-core lint

      - name: editor 타입체크 + 테스트 (감사 §8 ⑤ — CI 커버리지 공백 해소)
        # ⚠️ canvas-core **build 선행 필수** — editor 의 tsconfig references 는 tsconfig.node.json
        # 뿐이라 tsc -b 가 canvas-core 를 빌드해 주지 않고, node_modules 심링크의 **dist d.ts** 로
        # 해석한다. dist 가 없거나 스테일이면 typecheck 이 깨진다(2026-08-01 로컬 실증: 7-11 자
        # dist 가 07-24 hotkey 메타 필드를 결여 → HotkeyLike 45 에러, 재빌드로 0). vitest 는
        # src alias 라 무관하지만 typecheck 이 이 스텝에 있으므로 빌드를 앞세운다.
        # @storige/ai 도 빌드한다 — editor 의 workspace 의존인데 exports 가 전부 dist/* 라,
        # editor 소스가 첫 import 를 추가하는 순간 청정 설치 CI 에서만 TS2307 로 깨지는
        # 동형 함정이 잠복한다(현재 import 0건, tsup 수 초 — 선제 제거).
        run: |
          pnpm --filter @storige/ai build
          pnpm --filter @storige/canvas-core build
          pnpm --filter @storige/editor typecheck
          pnpm --filter @storige/editor test

      - name: admin 테스트 (감사 §8 ⑤)
        run: pnpm --filter @storige/admin test

      - name: indesign-import 타입체크 + 테스트 (감사 §8 ⑤)
        # test 스크립트의 글롭은 **인용**돼 있다(`node --test "src/**/*.test.mjs"`) — 셸(dash) 확장을
        # 우회하고 node 내부 globstar 가 재귀 해석하므로 테스트 파일 깊이와 무관하게 매치된다.
        # (종전 비인용 글롭은 dash 에서 2단계 고정이라 깊이 변경 시 조용히 누락 — 08-01 견고화.)
        run: |
          pnpm --filter @storige/indesign-import typecheck
          pnpm --filter @storige/indesign-import test

      - name: PDF 골든 비교 엔진 self-test
        run: node --test scripts/pdf-golden/compare.test.mjs

      - name: 소스맵 제거 게이트 self-test (editor/admin postbuild 판정 로직)
        # CI 는 editor/admin 을 빌드하지 않으므로(무거움) 이 self-test 가 판정 로직의 유일한
        # 회귀 가드다. 오탐 1건이 '맵 보존 → 원본 소스 공개 배포'로 직결된다.
        run: node scripts/strip-sourcemaps.mjs --self-test

      - name: 파트너 quickstart 예제 (examples/* — 타입체크 + 오프라인/E2E 검증)
        # sdk 빌드 뒤여야 한다 — 예제는 workspace:* 로 dist 를 실제 import 한다.
        # verify 는 전부 외부 의존 0: 주문 예제 2종은 주입식 fetch 로 호출 시퀀스를,
        # webhook-receiver 는 임시 포트에 실서버를 띄우고 서명을 직접 만들어 E2E 를 돈다.
        # (이 스텝이 없으면 예제가 SDK 변경으로 조용히 썩는다 — 위 ⚠️ 참조)
        #
        # ⚠️ **의도적으로 맨 뒤다.** 예제는 문서성 산출물이라 api/sdk/canvas-core 계약
        #    테스트보다 우선순위가 낮다. 앞에 두면 예제 하나가 깨졌을 때 그 뒤의
        #    contract-freeze 수백 건이 **실행조차 되지 않아** 진짜 회귀가 가려진다.
        run: |
          for e in pdf-upload-order editor-session-order webhook-receiver; do
            pnpm --filter "@storige/example-$e" typecheck
            pnpm --filter "@storige/example-$e" lint
            pnpm --filter "@storige/example-$e" verify
          done

      - name: 문서 포털 공개 모드 빌드 (색인 차단 OFF 분기 게이트 — 산출물은 버린다)
        # 아래 아티팩트 빌드는 색인 차단 모드 **하나만** 돈다. 그것뿐이면 공개 모드 코드경로
        # (renderRobots(false) · layout 의 robots meta 미부착 분기)가 CI 에서 **한 번도
        # 실행되지 않아**, 오너가 공개로 전환하는 날의 첫 실행이 곧 프로덕션이 된다.
        # 여기서 공개 모드를 먼저 한 번 돌려 두 분기 모두 게이트에 건다.
        #
        # ⚠️ 순서 고정 — 이 스텝이 **먼저**여야 한다. 뒤의 차단 모드 빌드가 site/ 를 통째로
        #    지우고 다시 쓰므로(build.mjs 의 rmSync(SITE_DIR)) 업로드되는 산출물은 항상
        #    차단본 하나다. 순서를 뒤집으면 공개본이 아티팩트로 올라가 P1 이 그대로 재발한다.
        #
        # 공개 모드는 `STORIGE_DOCS_PUBLIC=1` **명시 opt-in** 으로 켠다(build.mjs). 차단이
        # 기본값이라 env 를 빼면 이 스텝은 차단본을 만들어 아래 단언에서 실패한다 — 즉
        # 이 env 는 "공개 분기를 실제로 태우겠다"는 선언이며, 여기서만 스텝 범위로 산다.
        env:
          STORIGE_DOCS_PUBLIC: '1'
        run: |
          pnpm --filter @storige/docs build
          grep -qx 'Disallow:' apps/docs/site/robots.txt \
            || { echo "::error::공개 모드인데 robots.txt 가 크롤 허용본이 아니다"; exit 1; }
          tagged=$(grep -rl 'content="noindex, nofollow"' apps/docs/site --include='*.html' | wc -l)
          [ "$tagged" -eq 0 ] \
            || { echo "::error::공개 모드인데 HTML $tagged 개에 noindex meta 가 남아 있다"; exit 1; }

      - name: 파트너 문서 포털 빌드 (apps/docs — GUIDE 발행 채널 · guard R1~R5 + linkcheck)
        # 위 'OpenAPI export' 스텝의 산출물(apps/api/openapi-partner.json)을 **재사용**한다.
        # build.mjs 의 스펙 탐색 순서 3번째가 그 경로다. 같은 커밋이면 같은 스펙이므로
        # 재생성은 낭비이고, 두 번 생성하면 두 산출물이 갈릴 여지만 생긴다.
        #
        # strict 모드(--dev 아님)로 돈다 — 매니페스트에 등재된 콘텐츠가 하나라도 없으면
        # 실패한다(R5). 이게 "페이지가 조용히 빠진 채 배포되는" 유일한 자동 방지선이다.
        # 빌드는 순서대로 guard R1(호스트 화이트리스트=IP-in-URL 차단)·R2(bare IPv4)·
        # R3(내부 포인터/시크릿 형태)·R4(링크·앵커 전수 해석)·R5(매니페스트)를 돌고,
        # postbuild 로 check-source-exposure 가 site/ 를 다시 스캔한다.
        #
        # ⚠️ **아티팩트는 색인 차단 모드로 빌드한다 — 실제 배포 모드와 일치시켜야 오너가
        #    오판하지 않는다.** 이 스텝에 STORIGE_DOCS_NOINDEX=1 이 없던 시절 아티팩트는
        #    실측상 robots.txt 가 크롤 허용본, HTML 10개 중 noindex meta 0개인 **공개 모드**로
        #    만들어졌다. 아래 업로드가 배포 전 육안 확인의 유일한 창이므로, 오너는 그걸 열고
        #    "색인 차단이 꺼져 있다"고 오판하게 된다. 아티팩트는 배포(vercel.json 의
        #    X-Robots-Tag 헤더, apps/docs/DEPLOY.md §0-1)와 **같은 모드**여야 한다는 게
        #    여기 규칙이고, 아래 단언이 그 규칙을 매 실행 강제한다.
        #    → 이 env 는 이제 하위호환 표기다(차단이 build.mjs 의 기본값이라 없어도 차단본이
        #      나온다). 명시해 두는 이유는 아티팩트의 모드를 이 파일만 읽고 알 수 있게 하기
        #      위해서다. 실제 공개 전환은 이 env 를 지우는 게 아니라, DEPLOY.md 의 전환
        #      절차대로 STORIGE_DOCS_PUBLIC=1 을 주고 vercel.json 의 X-Robots-Tag **헤더
        #      항목**까지 함께 걷는 일이다.
        #
        # ⚠️ **의도적으로 맨 뒤다** — examples 스텝과 같은 이유다. 문서 포털은 문서성
        #    산출물이라 계약 테스트보다 우선순위가 낮다. 앞에 두면 GUIDE 의 오타 하나
        #    (linkcheck R4)가 그 뒤 contract-freeze 수백 건을 **실행조차 못 하게** 만든다.
        #
        # ⚠️ 루트 `pnpm build`(turbo)는 문서 포털을 제외한다(스펙 선행 생성이 필요해서).
        #    즉 **이 스텝이 포털의 유일한 CI 게이트다** — 지우면 포털 검증이 전부 사라진다.
        env:
          STORIGE_DOCS_NOINDEX: '1'
        run: |
          pnpm --filter @storige/docs build
          grep -qx 'Disallow: /' apps/docs/site/robots.txt \
            || { echo "::error::차단 모드인데 robots.txt 가 'Disallow: /' 가 아니다"; exit 1; }
          total=$(find apps/docs/site -name '*.html' | wc -l)
          tagged=$(grep -rl 'content="noindex, nofollow"' apps/docs/site --include='*.html' | wc -l)
          [ "$total" -gt 0 ] || { echo "::error::HTML 산출물이 0개다 — 빌드가 비었다"; exit 1; }
          [ "$total" -eq "$tagged" ] \
            || { echo "::error::HTML $total 개 중 $tagged 개만 noindex meta 를 달았다"; exit 1; }
          echo "색인 차단 확인 — robots.txt Disallow: / · HTML $tagged/$total 에 noindex meta"

      - name: 문서 포털 산출물 업로드 (배포 전 오너 육안 확인용 — 자동 배포 아님)
        # storige-docs Vercel 프로젝트는 오너 승인 게이트에 걸려 있다(apps/docs/DEPLOY.md).
        # 그때까지 이 아티팩트가 "무엇이 실릴 것인가"를 보는 유일한 창이다.
        #
        # ⚠️ 이 아티팩트는 **색인 차단본 하나뿐**이다(위 스텝의 env + 순서 고정). 공개 모드
        #    빌드는 검증만 하고 덮어써서 버린다 — 두 벌을 올리면 오너가 어느 쪽이 실릴지
        #    분간할 수 없다.
        uses: actions/upload-artifact@v4
        with:
          name: docs-portal-site
          path: apps/docs/site
          if-no-files-found: error
